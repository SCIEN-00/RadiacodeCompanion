name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test tests/Radiacode.Core.Tests -c Release

  linux:
    needs: [version, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            deb: amd64
            runner: ubuntu-latest
          - rid: linux-arm64
            deb: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish
        run: >
          dotnet publish src/Radiacode.App/Radiacode.App.csproj -c Release -f net10.0-desktop
          -r ${{ matrix.rid }} --self-contained -p:Version=$VERSION -o out/${{ matrix.rid }}
      - name: Package (.deb)
        run: |
          chmod +x packaging/linux/build-deb.sh
          packaging/linux/build-deb.sh out/${{ matrix.rid }} "$VERSION" ${{ matrix.deb }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: radiacode-companion-${{ matrix.rid }}
          path: dist/*

  windows:
    needs: [version, test]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/Radiacode.App/Radiacode.App.csproj -c Release -f net10.0-windows10.0.26100
          -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} --self-contained -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -p:Version=$env:VERSION -o out/${{ matrix.rid }}
      - name: Installer (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $arch = '${{ matrix.rid }}'.Replace('win-', '')
          & $iscc /Q "/DVersion=$env:VERSION" "/DArch=$arch" "/DSourceDir=$pwd\out\${{ matrix.rid }}" "/DOutputDir=$pwd\dist" packaging\windows\radiacode-companion.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        with:
          name: radiacode-companion-${{ matrix.rid }}
          path: dist/*
      # Unsigned MSIX for Microsoft Store upload (the Store signs it). Not part of the GitHub release.
      - name: Store package (.msix)
        shell: pwsh
        run: |
          dotnet build src/Radiacode.App/Radiacode.App.csproj -c Release -f net10.0-windows10.0.26100 `
            -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} --self-contained `
            -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false `
            -p:AppxBundle=Never -p:ApplicationDisplayVersion=$env:VERSION -p:ApplicationVersion=0 `
            -p:AppxPackageDir="$pwd/msix/"
          New-Item -ItemType Directory store -Force | Out-Null
          Get-ChildItem msix -Recurse -Filter *.msix | Copy-Item -Destination "store/radiacode-companion_$($env:VERSION)_${{ matrix.rid }}.msix"
      - uses: actions/upload-artifact@v4
        with:
          name: store-msix-${{ matrix.rid }}
          path: store/*.msix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: radiacode-companion-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # New version → pull request to microsoft/winget-pkgs (needs the WINGET_TOKEN secret: classic PAT, public_repo + workflow).
  # Runs here instead of on the release event: releases created with GITHUB_TOKEN don't trigger other workflows.
  winget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, release]
    runs-on: ubuntu-latest
    # Until the first version (0.1.1) is merged into winget-pkgs there is nothing to update; don't fail the release.
    continue-on-error: true
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: SCIENindustries.RadiacodeCompanion
          version: ${{ needs.version.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '_setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  # New version → Microsoft Store submission (submitted for certification automatically).
  # Needs the repo secrets MSSTORE_TENANT_ID, MSSTORE_SELLER_ID, MSSTORE_CLIENT_ID, MSSTORE_CLIENT_SECRET (Partner Center
  # Entra application, role Manager) and MSSTORE_PRODUCT_ID (Store ID, 9N…). Skipped while they are missing.
  store:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows]
    runs-on: windows-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_STORE: ${{ secrets.MSSTORE_CLIENT_SECRET != '' && secrets.MSSTORE_PRODUCT_ID != '' }}
    steps:
      - if: env.HAS_STORE != 'true'
        run: echo "Microsoft Store secrets not set; skipping the Store submission."
      - if: env.HAS_STORE == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_STORE == 'true'
        uses: actions/download-artifact@v5
        with:
          pattern: store-msix-*
          path: store
          merge-multiple: true
      # x64 + arm64 in one .msixbundle, so a single upload replaces both packages
      - if: env.HAS_STORE == 'true'
        name: Bundle
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName bundle /d store /p "radiacode-companion_$($env:VERSION).msixbundle" /bv "$($env:VERSION).0" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed ($LASTEXITCODE)" }
      - if: env.HAS_STORE == 'true'
        uses: microsoft/setup-msstore-cli@v1
      - if: env.HAS_STORE == 'true'
        name: Submit to the Microsoft Store
        shell: pwsh
        run: |
          msstore reconfigure --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" --sellerId "${{ secrets.MSSTORE_SELLER_ID }}" `
            --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}"
          msstore publish "radiacode-companion_$($env:VERSION).msixbundle" `
            --appId "${{ secrets.MSSTORE_PRODUCT_ID }}" --verbose
          # a package path (not a project) makes msstore upload this exact file instead of building the project itself
